name: One-time history email scrub

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scrub-history.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite commit email metadata and remove this workflow
        shell: bash
        env:
          OLD_EMAIL: prinon.turio@gmail.com
          NEW_EMAIL: 1134589+turio@users.noreply.github.com
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1

          git filter-branch --force --env-filter '
            if [ "$GIT_AUTHOR_EMAIL" = "$OLD_EMAIL" ]; then
              export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
            fi
            if [ "$GIT_COMMITTER_EMAIL" = "$OLD_EMAIL" ]; then
              export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
            fi
          ' -- HEAD

          git checkout -B main
          git config user.name "turio"
          git config user.email "$NEW_EMAIL"

          rm -f .github/workflows/scrub-history.yml
          git add -A
          git commit -m "Remove one-time history scrub workflow"

          git push origin +main:main
