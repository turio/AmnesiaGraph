name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
